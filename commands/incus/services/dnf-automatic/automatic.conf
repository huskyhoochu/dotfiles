# 자동 보안 업데이트 오버라이드 (계획 §1-4) — deploy.sh 가 호스트와 전 컨테이너의
# /etc/dnf/automatic.conf 로 배포한다. 기본값(/usr/share/dnf5/dnf5-plugins/automatic.conf)
# 과 다른 값만 적는다. 실행 주기는 dnf5-automatic.timer (매일 06:00 + 무작위 60분).

[commands]
# 보안 분류 업데이트만 자동 적용한다. 전체 업데이트는 사람이 시점을 고른다 —
# 컨테이너는 업그레이드 전에 스냅샷을 찍는 운영 방식(§6)과 충돌하지 않게.
upgrade_type = security
apply_updates = yes
