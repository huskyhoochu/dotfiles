# Litestream 설정 — 호스트 /etc/litestream.yml (계획 §7 백업, §12 4단계)
#
# SQLite 를 초 단위로 로컬 복제한다. Drive 업로드는 여기서 하지 않는다 —
# Litestream 은 Drive 를 지원하지 않으므로, 이 복제본 디렉토리를 백업
# 파이프라인(services/backup/)의 restic 이 시간 단위로 실어 나른다.
#
# **호스트에서 돈다** (2026-08-20 이전). 이전에는 apps 컨테이너 안에 있었는데,
# 컨테이너는 `source: /mnt/data/<자기이름>` 만 마운트받으므로 구조적으로 다른
# 컨테이너의 DB 에 닿을 수 없었다. 그 결과 DB 9개 중 2개만 복제되고 있었고,
# 가장 중요한 gitea.db(Forgejo 전체 — 이슈·PR·Actions 설정)가 빠져 있었다.
# 복제는 컨테이너의 부속물이 아니라 인프라 층이므로 백업 파이프라인과 같은
# 자리(호스트)에 둔다.
#
# 대상 DB 조건: **WAL 모드 필수** — Litestream 이 WAL 을 읽어 복제한다.
# busy_timeout=5000 도 함께 건다 — 미설정 시 동시 쓰기 97% 실패 실측(§12 4단계).
#
# 제외: apps/nocodb/noco.db 는 journal_mode=delete 라 대상이 될 수 없다.
# NocoDB 를 멈추고 WAL 로 바꿔야 하는데 서비스 설정 변경이라 매시 restic
# 백업에 맡긴다 (2026-08-20 판단).

dbs:
  # ── core 컨테이너 ────────────────────────────────────────────────
  # Forgejo 전체가 여기 있다 — 저장소 메타·이슈·PR·Actions 설정·사용자.
  # 잃으면 git 저장소는 미러에서 되찾아도 이슈와 PR 은 못 되찾는다.
  - path: /mnt/data/core/forgejo/gitea/gitea.db
    replicas:
      - url: file:///mnt/data/backup/litestream/gitea

  - path: /mnt/data/core/uptime-kuma/kuma.db
    replicas:
      - url: file:///mnt/data/backup/litestream/uptime-kuma

  # ── ci 컨테이너 ──────────────────────────────────────────────────
  # 에이전트 실행 이력. restic 은 /mnt/data/ci 를 통째로 제외하므로
  # (CI 캐시 전제) 이 복제본이 유일한 백업 경로다.
  - path: /mnt/data/ci/sqlite/flue-agents.db
    replicas:
      - url: file:///mnt/data/backup/litestream/flue-agents

  # ── apps 컨테이너 ────────────────────────────────────────────────
  - path: /mnt/data/apps/sqlite/arxiv-candidates.db
    replicas:
      - url: file:///mnt/data/backup/litestream/arxiv-candidates

  - path: /mnt/data/apps/sqlite/polydeukes-cognee.db
    replicas:
      - url: file:///mnt/data/backup/litestream/polydeukes-cognee

  - path: /mnt/data/apps/sqlite/cache.db
    replicas:
      - url: file:///mnt/data/backup/litestream/cache

  - path: /mnt/data/apps/n8n/database.sqlite
    replicas:
      - url: file:///mnt/data/backup/litestream/n8n

  # ── media 컨테이너 ───────────────────────────────────────────────
  - path: /mnt/data/media/jellyfin/config/data/jellyfin.db
    replicas:
      - url: file:///mnt/data/backup/litestream/jellyfin
